<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aly.bar</title>
    <style>
       
        body {
            background-color: #111;
            background-image: repeating-linear-gradient(-45deg,
                #111 0px,
                #111 12px,
                #171717 12px,
                #171717 24px);
            color: #fff;
            font-family: "Courier New", monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        
        .terminal-box {
            background-color: #0e1013;
            border: 1px solid #22262c;
            border-radius: 4px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        
        .terminal-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background-color: #161a22;
            border-bottom: 1px solid #22262c;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 10px;
            gap: 6px;
        }

        .dot { width: 6px; height: 6px; border-radius: 50%; background-color: #333; }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-top: 15px;
            margin-bottom: 2px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .meta-line {
            font-size: 0.85rem;
            color: #5c6370; 
            margin-bottom: 25px;
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #abb2bf;
            text-align: left;
            border-left: 2px solid #3e4452;
            padding-left: 15px;
            margin-bottom: 25px;
        }

        
        .nav-links {
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .nav-links a {
            color: #56b6c2; 
            text-decoration: none;
            padding: 2px 6px;
            transition: all 0.2s ease;
        }

        .nav-links a:hover {
            color: #111;
            background-color: #56b6c2; 
        }

        .badge-container {
            border-top: 1px dashed #22262c;
            padding-top: 20px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge-container img {
            width: 88px;
            height: 31px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            opacity: 0.7;
            filter: grayscale(20%);
            transition: all 0.2s ease;
        }

        .badge-container img:hover {
            opacity: 1;
            filter: none;
        }
    </style>
</head>
<body>

    <div class="terminal-box">

        <div class="terminal-header">
            <div class="dot"></div>

            <div class="dot"></div>
        </div>

        </div>

        <div class="badge-container">

            <a href="https://mikuna.lol" target="_blank"><img src="https://aly.bar/crexxbutto.png" alt="crexx"></a>

</html>
